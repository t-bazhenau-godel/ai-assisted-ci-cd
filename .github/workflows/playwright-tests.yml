name: Playwright Tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    name: playwright-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    env:
      CI: true

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js LTS with Yarn cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      # Install dependencies using the frozen lockfile for reproducible builds
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      # Install Playwright browsers and required system dependencies
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      # Run the full Playwright test suite in parallel
      - name: Run Playwright tests
        run: yarn playwright test

      # Upload the HTML report for easy viewing in the GitHub Actions UI
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

      # Upload Playwright traces for debugging failed tests
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: test-results/**/trace*.zip
          retention-days: 30

      # Notify Microsoft Teams when the workflow fails
      - name: Notify Teams on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "@type": "MessageCard",
              "@context": "https://schema.org/extensions",
              "summary": "Playwright Tests Failed",
              "themeColor": "FF0000",
              "title": "❌ Playwright Tests Failed",
              "sections": [{
                "facts": [
                  { "name": "PR Title",  "value": "${{ github.event.pull_request.title }}" },
                  { "name": "PR Author", "value": "${{ github.event.pull_request.user.login }}" },
                  { "name": "Branch",    "value": "${{ github.head_ref }}" },
                  { "name": "Run URL",   "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                ]
              }]
            }' \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"

      # Fetch existing history.json from gh-pages and append a new record
      - name: Prepare history.json
        if: always() && github.ref == 'refs/heads/main'
        run: |
          ENTRY=$(jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg ref "${{ github.ref }}" \
            --arg conclusion "${{ job.status }}" \
            '{timestamp: $ts, run_url: $run_url, sha: $sha, ref: $ref, conclusion: $conclusion}')

          # Try to fetch history.json from the gh-pages branch
          git fetch origin gh-pages 2>/dev/null || true
          if git show origin/gh-pages:history.json > /tmp/prev_history.json 2>/dev/null; then
            jq ". + [$ENTRY]" /tmp/prev_history.json > playwright-report/history.json
          else
            echo "[$ENTRY]" | jq '.' > playwright-report/history.json
          fi

      # Upload the report directory as a Pages artifact
      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deploy-pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      - name: Run yarn audit
        id: yarn-audit
        run: |
          yarn audit --level high --json > audit-report.json 2>&1 || true
          HIGH=$(grep -c '"type":"auditAdvisory"' audit-report.json || echo 0)
          CRITICAL=$(grep -c '"severity":"critical"' audit-report.json || echo 0)
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          {
            echo "## Dependency Vulnerability Scan"
            echo ""
            if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
              echo "**Result: FAILED**"
              echo ""
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| High     | $HIGH |"
              echo "| Critical | $CRITICAL |"
            else
              echo "**Result: PASSED** — No high or critical vulnerabilities found."
            fi
          } >> $GITHUB_STEP_SUMMARY
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            exit 1
          fi
